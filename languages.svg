<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 380" role="img" width="920" height="380">
  <title>Language share across public and private repositories</title>
  <desc>By codebase: PHP 58.1%, TypeScript 18.7%, Go 9.5%, JavaScript 5.9%, SCSS 2.6%, CSS 1.9%, Rust 1.6%. By commits: TypeScript 50.5%, Go 21.6%, PHP 7.4%, Rust 5.4%, JavaScript 4.9%, CSS 2.8%, HTML 2.2%. Own public and private repositories, forks excluded. Commits are weighted by each repository's language mix. Snapshot November 2026. Repository names are not listed.</desc>
  <rect width="920" height="380" rx="12" fill="#0d1117" stroke="#30363d"/>
  <text x="32" y="40" fill="#8b949e" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">public and private · November 2026</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
